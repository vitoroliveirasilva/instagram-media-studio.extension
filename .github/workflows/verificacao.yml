name: Verificação e publicação

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  verificar:
    name: Validar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Verificar código e testes
        run: npm run verificar
      - name: Compilar e empacotar extensão
        run: npm run empacotar
      - name: Disponibilizar extensão compilada
        uses: actions/upload-artifact@v4
        with:
          name: instagram-media-studio
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Disponibilizar pacote e integridade
        uses: actions/upload-artifact@v4
        with:
          name: distribuicao
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Publicar release de produção
    needs: verificar
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Baixar pacote validado
        uses: actions/download-artifact@v4
        with:
          name: distribuicao
          path: artifacts
      - name: Publicar versão validada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          versao=$(node -p "require('./package.json').version")
          tag="v$versao"
          notas="docs/releases/$tag.md"
          arquivo="instagram-media-studio-$tag.zip"
          test -s "$notas"
          (cd artifacts && sha256sum -c "$arquivo.sha256")
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$COMMIT"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "artifacts/$arquivo" "artifacts/$arquivo.sha256" --clobber
            gh release edit "$tag" --title "Instagram Media Studio $tag" --notes-file "$notas" --draft=false --prerelease=false --latest
          else
            gh release create "$tag" "artifacts/$arquivo" "artifacts/$arquivo.sha256" --target "$COMMIT" --title "Instagram Media Studio $tag" --notes-file "$notas" --latest
          fi
