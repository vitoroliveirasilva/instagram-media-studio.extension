name: Verificação da extensão

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Validar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar código e testes
        run: npm run verificar
      - name: Compilar extensão
        run: npm run build
      - name: Validar manifesto compilado
        run: node -e "const m = require('./dist/manifest.json'); if (m.manifest_version !== 3) process.exit(1); for (const p of [m.side_panel.default_path, m.background.service_worker, ...m.content_scripts.flatMap(s => s.js)]) if (!require('node:fs').existsSync('dist/' + p)) throw new Error(p)"
      - name: Disponibilizar extensão compilada
        uses: actions/upload-artifact@v4
        with:
          name: instagram-media-studio
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Publicar primeira versão
    needs: verificar
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Baixar extensão validada
        uses: actions/download-artifact@v4
        with:
          name: instagram-media-studio
          path: pacote
      - name: Preparar e publicar versão 0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          versao=$(node -p "require('./package.json').version")
          manifesto=$(node -p "require('./pacote/manifest.json').version")
          if [ "$versao" != "0.2.0" ]; then
            echo "Publicação inicial não se aplica a esta versão."
            exit 0
          fi
          test "$versao" = "$manifesto"
          tag="v$versao"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A versão já foi publicada."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$COMMIT"
          fi
          arquivo="instagram-media-studio-$tag.zip"
          (cd pacote && zip -qr "../$arquivo" .)
          sha256sum "$arquivo" > "$arquivo.sha256"
          gh release create "$tag" "$arquivo" "$arquivo.sha256" --target "$COMMIT" --title "Instagram Media Studio $tag" --notes-file docs/releases/v0.2.0.md --prerelease
