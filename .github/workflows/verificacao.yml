name: Verificação da extensão

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Validar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar código e testes
        run: npm run verificar
      - name: Compilar extensão
        run: npm run build
      - name: Validar manifesto compilado
        run: node -e "const m = require('./dist/manifest.json'); if (m.manifest_version !== 3) process.exit(1); for (const p of [m.side_panel.default_path, m.background.service_worker, ...m.content_scripts.flatMap(s => s.js)]) if (!require('node:fs').existsSync('dist/' + p)) throw new Error(p)"
      - name: Disponibilizar extensão compilada
        uses: actions/upload-artifact@v4
        with:
          name: instagram-media-studio
          path: dist/
          if-no-files-found: error
          retention-days: 14
